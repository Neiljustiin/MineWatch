<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineWatch — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
input{font:inherit;color:inherit}
input:focus{outline:2px solid #2F5BD3;outline-offset:0;border-color:#2F5BD3}
a:focus-visible,button:focus-visible{outline:2px solid #2F5BD3;outline-offset:2px}
.mw-login:hover{background:#2B2D31}
.mw-back:hover{color:#17181A}
.mw-show:hover{background:#EDEDE9}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 40px 20px; background: #F3F3F1; color: #17181A; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.4; font-feature-settings: 'cv11', 'ss01'; display: flex; align-items: center; justify-content: center">
  <main style="width: 100%; max-width: 380px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 6px; overflow: hidden">
    <form id="mw-form" style="padding: 26px 28px 24px; display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true" style="flex: none"><rect x="1" y="1" width="20" height="20" rx="3" fill="#17181A"></rect><path d="M5.5 15.5 L9.2 8.5 L11.8 12.8 L13.6 10 L16.5 15.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="15.4" cy="6.6" r="1.3" fill="#FFFFFF"></circle></svg>
        <div style="display: flex; flex-direction: column; line-height: 1.1">
          <h1 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em">MineWatch</h1>
          <span style="font-size: 11px; color: #5F6368; letter-spacing: 0.02em">Illegal Mining Detection</span>
        </div>
      </div>

      <div role="group" aria-label="Log in" style="display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; color: #3D4044">ANALYST NAME OR EMAIL</span>
          <input id="mw-name" type="text" autocomplete="username" style="height: 38px; box-sizing: border-box; padding: 0 11px; border: 1px solid #C9C9C4; border-radius: 4px; background: #FFFFFF; font-size: 13.5px">
        </label>

        <label style="display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; color: #3D4044">PASSWORD</span>
          <span style="position: relative; display: flex">
            <input id="mw-pw" type="password" autocomplete="current-password" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 58px 0 11px; border: 1px solid #C9C9C4; border-radius: 4px; background: #FFFFFF; font-size: 13.5px">
            <button id="mw-show-btn" type="button" class="mw-show" aria-pressed="false" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; height: 30px; padding: 0 9px; border: 0; border-radius: 3px; background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; color: #3D4044">Show</button>
          </span>
        </label>

        <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5F6368">Your name signs every decision you record — use your real name.</p>

        <p id="mw-error" role="alert" hidden style="margin: 0; padding: 8px 10px; border: 1px solid #17181A; border-radius: 4px; font-size: 12px; font-weight: 500">Enter your analyst name or email and your password.</p>

        <button id="mw-submit" type="submit" class="mw-login" style="height: 40px; border: 0; border-radius: 4px; background: #17181A; color: #FFFFFF; cursor: pointer; font-size: 13.5px; font-weight: 600">Log in</button>

        <p style="margin: 0; text-align: center; font-size: 12px; color: #5F6368">Access is limited to designated analysts.</p>
      </div>
    </form>

    <div style="padding: 11px 28px; border-top: 1px solid #E2E2DE; background: #FAFAF8">
      <a href="/" class="mw-back" style="font-size: 11.5px; color: #5F6368; text-decoration: none">← Back to overview</a>
    </div>
  </main>
</div>
<script>
(function(){
  var nameInput = document.getElementById('mw-name');
  var pwInput = document.getElementById('mw-pw');
  var showBtn = document.getElementById('mw-show-btn');
  var errorEl = document.getElementById('mw-error');
  var form = document.getElementById('mw-form');

  showBtn.addEventListener('click', function(){
    var showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    showBtn.textContent = showing ? 'Show' : 'Hide';
    showBtn.setAttribute('aria-pressed', String(!showing));
    showBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });
  [nameInput, pwInput].forEach(function(el){
    el.addEventListener('input', function(){ errorEl.hidden = true; });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var username = nameInput.value.trim();
    var password = pwInput.value;
    if (!username || !password) { errorEl.textContent = 'Enter your analyst name or email and your password.'; errorEl.hidden = false; return; }
    var submitBtn = document.getElementById('mw-submit');
    submitBtn.disabled = true;
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username: username, password: password })
    }).then(function(res){
      if (!res.ok) {
        return res.json().catch(function(){ return {}; }).then(function(data){
          throw new Error(data.detail || 'Invalid username or password.');
        });
      }
      return res.json();
    }).then(function(){
      window.location.href = '/app';
    }).catch(function(err){
      errorEl.textContent = err.message === 'invalid username or password' ? 'Invalid username or password.' : (err.message || 'Login failed.');
      errorEl.hidden = false;
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
